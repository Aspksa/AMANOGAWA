<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="description" content="AMANOGAWA — Млечный Путь.">
  <title>AMANOGAWA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.4' stop-color='%23a5b4fc'/%3E%3Cstop offset='1' stop-color='%23a5b4fc' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@300&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Меню иконками слева (на телефоне — снизу) -->
  <nav class="rail" aria-label="Основное меню">
    <a class="rail__brand" href="#/home" aria-label="AMANOGAWA — главная"><span class="brand__star" aria-hidden="true"></span></a>

    <div class="rail__links">
      <a class="rail__link" href="#/home" data-label="Главная">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        <span class="sr">Главная</span>
      </a>
      <a class="rail__link" href="#/docs" data-label="Документы">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        <span class="sr">Документы</span>
      </a>
      <a class="rail__link" href="#/graph" data-label="Граф знаний">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="m8.3 7 7.4.8M7 8.4l1.4 7.2M16.4 10l-5.6 6.2"/></svg>
        <span class="sr">Граф знаний</span>
      </a>
    </div>

    <a class="rail__link rail__link--end" href="#/settings" data-label="Настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span class="sr">Настройки</span>
    </a>
  </nav>

  <main class="stage">
    <!-- Главная: пустая и чистая -->
    <section class="view view--home" data-view="home" data-title="Главная" aria-label="Главная">
      <p class="home__mark" aria-hidden="true">天の川</p>
      <button class="avatar" type="button" data-chat-open aria-label="Открыть чат" title="Нажмите — чат, перетащите — переместить">
        <img src="img/avatar.webp" alt="" width="1000" height="1000">
        <span class="avatar__hint">Спросить</span>
      </button>
    </section>

    <!-- Документы -->
    <section class="view" data-view="docs" data-title="Документы" aria-labelledby="docs-title" hidden>
      <header class="view__head">
        <div>
          <h1 id="docs-title" class="view__title">Документы</h1>
          <p class="status" data-status role="status"></p>
        </div>
      </header>

      <label class="drop" id="docs-drop">
        <input type="file" id="docs-file" multiple>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span>Перетащите файлы или <u>выберите</u></span>
        <small>TXT и MD — сразу; PDF, Office и картинки — через парсер</small>
      </label>

      <ul class="docs" id="docs-list" aria-live="polite"></ul>
    </section>

    <!-- Граф знаний -->
    <section class="view view--graph" data-view="graph" data-title="Граф знаний" aria-labelledby="graph-title" hidden>
      <header class="view__head">
        <div>
          <h1 id="graph-title" class="view__title">Граф знаний</h1>
          <p class="status" id="graph-info" role="status"></p>
        </div>
        <form class="graph__tools" id="graph-form">
          <input id="graph-label" list="graph-labels" placeholder="Сущность или *" aria-label="Сущность" value="*">
          <datalist id="graph-labels"></datalist>
          <select id="graph-max" aria-label="Сколько узлов">
            <option value="100">100</option>
            <option value="300" selected>300</option>
            <option value="1000">1000</option>
          </select>
          <button class="btn-ghost" type="submit">Показать</button>
        </form>
      </header>

      <div class="graph">
        <canvas id="graph-canvas" aria-label="Граф сущностей и связей"></canvas>
        <aside class="graph__card" id="graph-card" hidden>
          <button class="graph__close" type="button" aria-label="Закрыть">×</button>
          <h2></h2>
          <p class="graph__type"></p>
          <p class="graph__desc"></p>
          <ul class="graph__links"></ul>
        </aside>
      </div>
    </section>

    <!-- Настройки -->
    <section class="view" data-view="settings" data-title="Настройки" aria-labelledby="settings-title" hidden>
      <header class="view__head">
        <div>
          <h1 id="settings-title" class="view__title">Настройки</h1>
          <p class="status" id="settings-status" role="status"></p>
        </div>
        <button class="btn-solid" type="submit" form="settings-form">Сохранить</button>
      </header>

      <form class="settings" id="settings-form" autocomplete="off">
        <fieldset class="group">
          <legend>Cloud.ru</legend>
          <label class="field field--wide">
            <span>Ключ API</span>
            <input type="password" name="api_key" id="set-key" placeholder="Вставьте ключ Foundation Models">
            <small id="set-key-hint">Хранится только в файле .env на этом компьютере.</small>
          </label>
          <label class="field field--wide">
            <span>Адрес API</span>
            <input name="CLOUDRU_BASE_URL" required>
          </label>
          <div class="field field--wide">
            <button class="btn-ghost" type="button" id="set-check">Проверить ключ и загрузить модели</button>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>Модели</legend>
          <label class="field field--wide">
            <span>Ответы (LLM)</span>
            <input name="LLM_MODEL" list="model-list" required>
          </label>
          <label class="field field--wide">
            <span>Эмбеддинги</span>
            <input name="EMBEDDING_MODEL" list="model-list" required>
            <small>У каждой модели эмбеддингов своя база: после смены документы надо загрузить заново.</small>
          </label>
          <label class="field">
            <span>Зрение (картинки в PDF)</span>
            <input name="VISION_MODEL" list="model-list" placeholder="не использовать">
          </label>
          <label class="field">
            <span>Размер эмбеддинга</span>
            <input name="EMBEDDING_DIM" inputmode="numeric" placeholder="авто">
          </label>
          <datalist id="model-list"></datalist>
        </fieldset>

        <fieldset class="group">
          <legend>Поиск</legend>
          <label class="field field--wide">
            <span>Как искать ответ</span>
            <select name="QUERY_MODE">
              <option value="mix">Смешанный — граф и текст (лучше всего)</option>
              <option value="hybrid">Граф: сущности и связи</option>
              <option value="local">Граф: только сущности</option>
              <option value="global">Граф: только связи</option>
              <option value="naive">Только похожие куски текста</option>
              <option value="bypass">Без базы — просто разговор с моделью</option>
            </select>
          </label>
          <label class="field">
            <span>Сколько результатов (top_k)</span>
            <input name="TOP_K" type="number" min="1" max="200">
          </label>
          <label class="field">
            <span>Память диалога, вопросов</span>
            <input name="HISTORY_TURNS" type="number" min="0" max="20">
          </label>
        </fieldset>

        <fieldset class="group">
          <legend>Индексация</legend>
          <label class="field">
            <span>Язык описаний в графе</span>
            <select name="SUMMARY_LANGUAGE">
              <option value="Russian">Русский</option>
              <option value="English">English</option>
            </select>
          </label>
          <label class="field">
            <span>Парсер PDF и Office</span>
            <select name="PARSER">
              <option value="mineru">MinerU</option>
              <option value="docling">Docling</option>
              <option value="paddleocr">PaddleOCR</option>
            </select>
          </label>
        </fieldset>
      </form>
    </section>
  </main>

  <!-- Маленький аватар на остальных страницах -->
  <button class="avatar-mini" type="button" data-chat-open aria-label="Открыть чат">
    <img src="img/avatar-face.webp" alt="" width="256" height="256">
  </button>

  <!-- Чат: открывается кликом по аватару -->
  <aside class="chat-panel" id="chat" aria-label="Чат с базой знаний" hidden>
    <header class="chat-panel__head">
      <img class="chat-panel__face" src="img/avatar-face.webp" alt="" width="256" height="256">
      <div class="chat-panel__title">
        <h2>AMANOGAWA</h2>
        <p class="status" data-status role="status"></p>
      </div>
      <button class="btn-ghost btn-small" type="button" id="chat-new" title="Новый диалог" aria-label="Новый диалог">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Новый диалог</span>
      </button>
      <button class="chat-panel__close" type="button" id="chat-close" aria-label="Закрыть чат">×</button>
    </header>

    <div class="chat" id="chat-log" aria-live="polite">
      <p class="empty">Спросите что-нибудь о загруженных документах.</p>
    </div>

    <form class="ask" id="chat-form">
      <textarea id="chat-q" rows="1" placeholder="Ваш вопрос…" aria-label="Ваш вопрос" required></textarea>
      <button class="btn-icon" type="submit" aria-label="Спросить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </aside>

  <script src="js/main.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
