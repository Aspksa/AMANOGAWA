<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="description" content="AMANOGAWA — Млечный Путь.">
  <title>AMANOGAWA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.4' stop-color='%23a5b4fc'/%3E%3Cstop offset='1' stop-color='%23a5b4fc' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@300&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="AMANOGAWA — на главную">
      <span class="brand__star" aria-hidden="true"></span>
      <span class="brand__name">AMANOGAWA</span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Открыть меню">
      <span></span><span></span>
    </button>

    <nav id="nav" class="nav" aria-label="Основное меню">
      <a href="#top" aria-current="page">Главная</a>
      <a href="#stages">Разделы</a>
      <a href="#about">О проекте</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="orbits" aria-hidden="true">
        <span class="orbit orbit--1"><i></i></span>
        <span class="orbit orbit--2"><i></i></span>
        <span class="orbit orbit--3"><i></i></span>
      </div>

      <p class="hero__kicker">天の川</p>
      <h1 class="hero__title">AMANOGAWA</h1>
      <p class="hero__lead">Небесная река. Здесь скоро что-то появится.</p>
      <a class="btn" href="#stages"><span>Смотреть дальше</span></a>

      <a class="scroll-hint" href="#stages" aria-label="Прокрутить вниз"><span></span></a>
    </section>

    <section id="stages" class="stages" aria-labelledby="stages-title">
      <p class="section-kicker reveal">01 — 03</p>
      <h2 id="stages-title" class="section-title reveal">Разделы</h2>
      <div class="grid">
        <article class="card card--empty reveal"><span class="card__num">01</span><p>Скоро</p></article>
        <article class="card card--empty reveal"><span class="card__num">02</span><p>Скоро</p></article>
        <article class="card card--empty reveal"><span class="card__num">03</span><p>Скоро</p></article>
      </div>
    </section>

    <section id="about" class="about" aria-labelledby="about-title">
      <p class="section-kicker reveal">∞</p>
      <h2 id="about-title" class="section-title reveal">О проекте</h2>
      <p class="muted reveal">Раздел в разработке.</p>
    </section>
  </main>

  <footer class="footer">
    <span class="footer__line" aria-hidden="true"></span>
    <span>© <span id="year"></span> AMANOGAWA · 天の川</span>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
